<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">James Williams — full-stack engineer and deep-code diver</title>
  <desc id="desc">An animated deep-ocean terminal scene introducing James Williams, also known as MarlboroJamez.</desc>

  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827" />
      <stop offset="0.55" stop-color="#07111f" />
      <stop offset="1" stop-color="#030711" />
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6e2" />
      <stop offset="0.52" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#ff6b9d" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="0.62" stop-color="#c5f6fa" />
      <stop offset="1" stop-color="#63e6e2" />
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#63e6e2" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.6" />
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="6" y="6" width="1188" height="408" rx="26" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="6" y="6" width="1188" height="408" rx="26" fill="url(#ocean)" />
    <rect x="6" y="6" width="1188" height="408" rx="26" fill="url(#grid)" />
    <circle cx="190" cy="95" r="310" fill="url(#cyanGlow)" />
    <circle cx="1090" cy="370" r="300" fill="url(#pinkGlow)" />

    <path d="M0 43 C140 18 250 71 390 44 S650 15 790 44 S1045 70 1200 38 L1200 0 L0 0 Z" fill="url(#surface)" opacity="0.14">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0 43 C140 18 250 71 390 44 S650 15 790 44 S1045 70 1200 38 L1200 0 L0 0 Z;
                M0 38 C135 70 260 17 400 43 S655 70 800 40 S1055 15 1200 45 L1200 0 L0 0 Z;
                M0 43 C140 18 250 71 390 44 S650 15 790 44 S1045 70 1200 38 L1200 0 L0 0 Z" />
    </path>
    <path d="M0 50 C150 26 255 77 400 51 S655 23 800 51 S1045 77 1200 46" fill="none" stroke="url(#surface)" stroke-width="2" opacity="0.75">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0 50 C150 26 255 77 400 51 S655 23 800 51 S1045 77 1200 46;
                M0 46 C140 77 270 25 410 50 S665 77 810 47 S1055 23 1200 52;
                M0 50 C150 26 255 77 400 51 S655 23 800 51 S1045 77 1200 46" />
    </path>

    <g opacity="0.8">
      <circle cx="1120" cy="350" r="4" fill="#63e6e2">
        <animate attributeName="cy" values="350;82" dur="8s" begin="-2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="-2s" repeatCount="indefinite" />
      </circle>
      <circle cx="1070" cy="325" r="7" fill="none" stroke="#63e6e2" stroke-width="2">
        <animate attributeName="cy" values="325;62" dur="10s" begin="-5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.65;0" dur="10s" begin="-5s" repeatCount="indefinite" />
      </circle>
      <circle cx="1150" cy="300" r="10" fill="none" stroke="#ff6b9d" stroke-width="2">
        <animate attributeName="cy" values="300;52" dur="12s" begin="-8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.55;0" dur="12s" begin="-8s" repeatCount="indefinite" />
      </circle>
      <circle cx="1028" cy="382" r="3" fill="#7dd3fc">
        <animate attributeName="cy" values="382;72" dur="9s" begin="-1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="-1s" repeatCount="indefinite" />
      </circle>
    </g>

    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g transform="translate(70 78)">
        <rect width="145" height="28" rx="14" fill="#63e6e2" fill-opacity="0.1" stroke="#63e6e2" stroke-opacity="0.45" />
        <circle cx="16" cy="14" r="4" fill="#63e6e2" filter="url(#softGlow)">
          <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
        </circle>
        <text x="29" y="18" fill="#a5f3fc" font-size="11" font-weight="700" letter-spacing="1.8">SIGNAL ONLINE</text>
      </g>

      <text x="70" y="166" fill="url(#titleGradient)" font-size="68" font-weight="800" letter-spacing="2">JAMES</text>
      <text x="70" y="228" fill="url(#titleGradient)" font-size="68" font-weight="800" letter-spacing="2">WILLIAMS</text>
      <rect x="72" y="248" width="48" height="3" rx="1.5" fill="#ff6b9d" />
      <rect x="127" y="248" width="110" height="3" rx="1.5" fill="#63e6e2" opacity="0.65" />

      <text x="70" y="286" fill="#e2e8f0" font-size="15" font-weight="700" letter-spacing="2.2">FULL-STACK ENGINEER</text>
      <text x="286" y="286" fill="#496779" font-size="15">//</text>
      <text x="318" y="286" fill="#63e6e2" font-size="15" font-weight="700" letter-spacing="2.2">DEEP-CODE DIVER</text>
      <text x="70" y="321" fill="#8fa9b9" font-size="15" letter-spacing="0.7">security · machine learning · creative code</text>

      <g transform="translate(70 350)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
        <path d="M6 0a6 6 0 1 0 0 12c4 0 6-6 6-6S10 0 6 0Zm0 3.2A2.8 2.8 0 1 1 6 8.8 2.8 2.8 0 0 1 6 3.2Z" fill="#ff6b9d" />
        <text x="23" y="11" fill="#6f8999" font-size="12" letter-spacing="1.4">UNDER_THE_SEA / @MARLBOROJAMEZ</text>
      </g>
    </g>

    <g transform="translate(704 89)" filter="url(#shadow)">
      <rect width="430" height="254" rx="17" fill="#07101b" stroke="#214153" stroke-width="1.5" />
      <path d="M0 17A17 17 0 0 1 17 0h396a17 17 0 0 1 17 17v25H0Z" fill="#0d2130" />
      <circle cx="22" cy="21" r="5" fill="#ff6b9d" />
      <circle cx="40" cy="21" r="5" fill="#fbbf24" />
      <circle cx="58" cy="21" r="5" fill="#63e6e2" />
      <text x="215" y="26" text-anchor="middle" fill="#668495" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">~/marlborojamez</text>

      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
        <text x="26" y="76" fill="#63e6e2">$</text>
        <text x="45" y="76" fill="#d6e4ec">whoami</text>
        <text x="26" y="101" fill="#7893a3">james_williams</text>

        <text x="26" y="137" fill="#63e6e2">$</text>
        <text x="45" y="137" fill="#d6e4ec">current_mission</text>
        <text x="26" y="162" fill="#ff8bb3">turn_ideas_into_useful_software</text>

        <text x="26" y="198" fill="#63e6e2">$</text>
        <text x="45" y="198" fill="#d6e4ec">status</text>
        <text x="26" y="223" fill="#7893a3">learning...</text>
        <rect x="124" y="210" width="8" height="16" rx="1" fill="#63e6e2">
          <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

    <g transform="translate(672 370)" opacity="0.55">
      <path d="M0 0 H462" stroke="#214153" stroke-width="1" stroke-dasharray="3 8" />
      <text x="0" y="22" fill="#527080" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5">DEPTH 404M</text>
      <text x="462" y="22" text-anchor="end" fill="#527080" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5">CURIOSITY 100%</text>
    </g>
  </g>

  <rect x="6" y="6" width="1188" height="408" rx="26" fill="none" stroke="#20445a" stroke-width="2" />
</svg>
